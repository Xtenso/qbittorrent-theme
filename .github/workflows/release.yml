# Publishes the four theme files (Nightseed, Alternative, OLED, Transparent) and the WebUI
# package as a new GitHub release whenever any of them changes on main. Older releases are
# kept; these links always serve the newest:
# https://github.com/Xtenso/qbittorrent-theme/releases/latest/download/Nightseed.qbtheme
# https://github.com/Xtenso/qbittorrent-theme/releases/latest/download/Nightseed-Alternative.qbtheme
# https://github.com/Xtenso/qbittorrent-theme/releases/latest/download/Nightseed-OLED.qbtheme
# https://github.com/Xtenso/qbittorrent-theme/releases/latest/download/Nightseed-Transparent.qbtheme
# https://github.com/Xtenso/qbittorrent-theme/releases/latest/download/Nightseed-WebUI.zip
#
# It publishes the theme files exactly as committed, so rebuild them first
# (python tools/build_theme.py) after changing source/. The WebUI package is zipped here
# from webui/ and source/icons, byte for byte the same when they haven't changed, so an
# unrelated push doesn't publish a release.

name: Release theme

on:
  push:
    branches: [main]
    paths:
      - Nightseed.qbtheme
      - Nightseed-Alternative.qbtheme
      - Nightseed-OLED.qbtheme
      - Nightseed-Transparent.qbtheme
      - webui/**
      - source/icons/**
      - .github/workflows/release.yml
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      THEMES: Nightseed.qbtheme Nightseed-Alternative.qbtheme Nightseed-OLED.qbtheme Nightseed-Transparent.qbtheme
      ASSETS: Nightseed.qbtheme Nightseed-Alternative.qbtheme Nightseed-OLED.qbtheme Nightseed-Transparent.qbtheme Nightseed-WebUI.zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history and tags, for the version check and the notes

      - name: Check the theme files are Qt resource bundles
        run: |
          for asset in $THEMES; do
            if [ "$(head -c 4 "$asset")" != "qres" ]; then
              echo "::error::$asset is not a Qt binary resource file"
              exit 1
            fi
          done

      # The package unzips into the two folders the linuxserver image setup uses (see
      # webui/README.md). Fixed timestamps and modes, a sorted file list and no extra
      # fields make the zip identical from run to run while its contents stay the same.
      - name: Build the WebUI package
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/webui-pkg"
          mkdir -p "$pkg/nightseed-src/parts" "$pkg/custom-cont-init.d"
          cp webui/core.css "$pkg/nightseed-src/"
          cp webui/parts/*.css "$pkg/nightseed-src/parts/"
          cp -r source/icons "$pkg/nightseed-src/icons"
          echo nightseed > "$pkg/nightseed-src/style"
          cp webui/nightseed.sh "$pkg/custom-cont-init.d/nightseed.sh"
          find "$pkg" -type f -exec chmod 644 {} +
          chmod 755 "$pkg/custom-cont-init.d/nightseed.sh"
          find "$pkg" -exec touch -h -d '2000-01-01T00:00:00Z' {} +
          (cd "$pkg" && find . -type f | LC_ALL=C sort | TZ=UTC zip -q -X -@ "$GITHUB_WORKSPACE/Nightseed-WebUI.zip")

      - name: Publish a release if any file differs from the latest one
        run: |
          set -euo pipefail

          # A file counts as changed when the latest release lacks it or has a different copy
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          changed=""
          for asset in $ASSETS; do
            if [ -z "$prev" ] ||
               ! gh release download "$prev" --pattern "$asset" --output "$RUNNER_TEMP/prev-$asset" ||
               ! cmp -s "$asset" "$RUNNER_TEMP/prev-$asset"; then
              changed="$changed $asset"
            fi
          done
          if [ -z "$changed" ]; then
            echo "All files are the same as in $prev; nothing to publish."
            exit 0
          fi
          echo "Changed:$changed"

          # Date-based version: v2026.11.14, then v2026.11.14.2 for a second release that day
          base="v$(date -u +%Y.%m.%d)"
          tag=$base
          n=2
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done

          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --format='- %s' "$prev..HEAD" -- source tools/build_theme.py webui $THEMES || true
            else
              echo "First release."
            fi
            echo
            echo "To install, download one of the theme files below (see [Four versions](https://github.com/$GITHUB_REPOSITORY#four-versions)) and follow the [install steps](https://github.com/$GITHUB_REPOSITORY#install)."
            echo
            echo "For the WebUI (qBittorrent in Docker), download **Nightseed-WebUI.zip** and follow [the WebUI steps](https://github.com/$GITHUB_REPOSITORY/tree/main/webui#install)."
          } > "$RUNNER_TEMP/notes.md"

          # $ASSETS is unquoted on purpose: one argument per file
          gh release create "$tag" $ASSETS \
            --target "$GITHUB_SHA" \
            --title "Nightseed ${tag#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
